name: CodeQL — Análisis de seguridad

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 2'  # Martes 9am (diferente al audit del lunes)

jobs:
  analyze:
    name: Analizar ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write  # Necesario para subir resultados a GitHub

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]  # Cubre Node.js + React en un solo job

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-extended  # Más exhaustivo que el default
          config: |
            paths:
              - server
              - client/src
            paths-ignore:
              - client/dist
              - '**/node_modules'
              - '**/*.test.js'
              - '**/*.spec.js'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Realizar análisis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"