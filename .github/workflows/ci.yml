name: CI — Triomphe Remates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  server-lint:
    name: Lint servidor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: server

      - name: Correr ESLint
        run: npm run lint
        working-directory: server

  server-test:
    name: Tests servidor
    runs-on: ubuntu-latest
    needs: server-lint
    services:
      mysql:
        image: mysql:8.0.36   # ✅ versión fija
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}   # ✅ secreto
          MYSQL_DATABASE: triomphe_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: server

      - name: Correr tests
        run: npm test
        working-directory: server
        env:
          NODE_ENV: test
          PORT: 3001
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: triomphe_test
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}      # ✅ secreto
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}   # ✅ secreto
          JWT_EXPIRES_IN: 7d
          CLIENT_URL: http://localhost:5173

  client-lint:
    name: Lint cliente
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: client

      - name: Correr ESLint
        run: npm run lint
        working-directory: client

  client-build:
    name: Build cliente
    runs-on: ubuntu-latest
    needs: client-lint
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: client

      - name: Build producción
        run: npm run build
        working-directory: client
        env:
          VITE_API_URL: http://localhost:3001/api